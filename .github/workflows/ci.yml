name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: lint, vuln, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-go runs golangci-lint and govulncheck as one gate, both with
      # continue-on-error, so a run reports every finding rather than stopping
      # at the first. The gate step is what fails the job.
      - uses: Rethunk-Tech/gh-actions/setup-go@45d60bff5148282bbbf11e6f2460829eab772cf2 # v1.9
        with:
          run-lint: "true"
          run-govulncheck: "true"

      - run: go build ./...
      - run: go test ./...
